# Los tests corren contra una base H2 en memoria, para no tocar la base de desarrollo
spring.datasource.url=jdbc:h2:mem:motorroll-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.show-sql=false

motorroll.datos-iniciales=false
motorroll.jwt.secret=clave-secreta-solo-para-los-tests-de-motorroll-api-2026
motorroll.jwt.expiracion-ms=3600000
