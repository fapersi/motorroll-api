spring.application.name=motorroll-api


spring.datasource.url=jdbc:h2:file:./data/motorroll;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


spring.jackson.default-property-inclusion=non_null


server.port=8080


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


motorroll.jwt.secret=${MOTORROLL_JWT_SECRET:clave-secreta-de-desarrollo-motorroll-tpo-aplicaciones-interactivas-2026}
motorroll.jwt.expiracion-ms=86400000


motorroll.datos-iniciales=true
