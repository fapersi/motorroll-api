spring.application.name=motorroll-api


spring.datasource.url=jdbc:h2:file:./data/motorroll;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50


spring.jackson.default-property-inclusion=non_null


server.port=8080


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


motorroll.jwt.secret=${MOTORROLL_JWT_SECRET:clave-secreta-de-desarrollo-motorroll-tpo-aplicaciones-interactivas-2026}
motorroll.jwt.expiracion-ms=86400000


motorroll.datos-iniciales=${MOTORROLL_DATOS_INICIALES:true}
motorroll.demo.clave-admin=${MOTORROLL_CLAVE_ADMIN:admin1234}
motorroll.demo.clave-vendedor=${MOTORROLL_CLAVE_VENDEDOR:vendedor1234}
motorroll.demo.clave-comprador=${MOTORROLL_CLAVE_COMPRADOR:comprador1234}


motorroll.front-url=${MOTORROLL_FRONT_URL:http://localhost:5173}
motorroll.mail.habilitado=${MOTORROLL_MAIL_HABILITADO:false}
motorroll.mail.desvio=${MOTORROLL_MAIL_DESVIO:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MOTORROLL_MAIL_USUARIO:}
spring.mail.password=${MOTORROLL_MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
