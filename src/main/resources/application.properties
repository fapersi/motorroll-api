spring.application.name=motorroll-api

# ------------------------------------------------------------------
# Base de datos H2 en archivo (los datos sobreviven al reinicio)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/motorroll;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# No serializar en el JSON los campos que vienen en null
spring.jackson.default-property-inclusion=non_null

# ------------------------------------------------------------------
# Servidor
# ------------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------------
# JWT (para produccion se define por variable de entorno)
# ------------------------------------------------------------------
motorroll.jwt.secret=${MOTORROLL_JWT_SECRET:clave-secreta-de-desarrollo-motorroll-tpo-aplicaciones-interactivas-2026}
motorroll.jwt.expiracion-ms=86400000

# ------------------------------------------------------------------
# Carga de datos de ejemplo al iniciar (catalogo de demostracion)
# ------------------------------------------------------------------
motorroll.datos-iniciales=true
